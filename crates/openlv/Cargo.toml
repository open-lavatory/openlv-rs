[package]
name = "openlv"
version = "0.1.0"
edition = "2024"
description = "a secure peer-to-peer wallet connectivity protocol"
license = "GPL-3.0"
documentation = "https://openlv.rs"
homepage = "https://openlv.rs"
repository = "https://github.com/open-lavatory/openlv-rs"

[lib]
name = "openlv"
path = "src/lib.rs"

[features]
default = ["runtime-tokio"]
alloy-1 = [
    "dep:alloy-json-rpc-1",
    "dep:alloy-rpc-client-1",
    "dep:alloy-transport-1",
    "dep:tower",
]
alloy-2 = [
    "dep:alloy-json-rpc-2",
    "dep:alloy-rpc-client-2",
    "dep:alloy-transport-2",
    "dep:tower",
]
runtime-tokio = ["webrtc/runtime-tokio"]
runtime-smol = ["webrtc/runtime-smol"]

[dependencies]
alloy-json-rpc-1 = { package = "alloy-json-rpc", version = "1.8", optional = true }
alloy-rpc-client-1 = { package = "alloy-rpc-client", version = "1.8", default-features = false, optional = true }
alloy-transport-1 = { package = "alloy-transport", version = "1.8", default-features = false, optional = true }
alloy-json-rpc-2 = { package = "alloy-json-rpc", version = "2.0", optional = true }
alloy-rpc-client-2 = { package = "alloy-rpc-client", version = "2.0", default-features = false, optional = true }
alloy-transport-2 = { package = "alloy-transport", version = "2.0", default-features = false, optional = true }
tower = { version = "0.5", optional = true }
aes-gcm = "0.10"
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
aead = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
crypto_secretbox = { version = "0.1", features = ["salsa20"] }
url = "2"

serde = { version = "1.0", features = ["derive"] }
regex = "1"
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"

mqtt5 = "0.32"
webrtc = "0.20.0-alpha.2"

# todo: support for rustls-tls vs others via feature flags?
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# todo: make runtime agnostic via feature flags (runtime-tokio, runtime-smol)
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }

tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[[example]]
name = "client"
path = "../../examples/client/main.rs"

[[example]]
name = "dapp"
path = "../../examples/app/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
qrcode = { version = "0.14.1", default-features = false }
alloy-primitives = "1"
alloy-signer = "1"
alloy-signer-local = { version = "1", features = ["mnemonic"] }
